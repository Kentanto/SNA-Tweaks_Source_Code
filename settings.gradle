pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'solarneutronactivatortweak'

// Only the NeoForge 1.21.1 module stays in the multi-module root (Gradle 8.11).
// The 1.20.1 variants have their own standalone Gradle wrappers using Gradle 7.6
// because ForgeGradle 5.x does not support Gradle 8+.
include 'neoforge-1.21.1'
