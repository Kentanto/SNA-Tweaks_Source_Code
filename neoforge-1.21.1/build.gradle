plugins {
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.115'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id + '-neoforge-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version_1_21_1

    parchment {
        mappingsVersion = project.parchment_mappings_version_1_21_1
        minecraftVersion = project.parchment_minecraft_version_1_21_1
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main {
    java.srcDirs = ["$rootDir/common/src/main/java", "src/main/java"]
    resources.srcDirs = ["src/main/resources", "$rootDir/common/src/main/resources"]
}

repositories {
    mavenCentral()
}

dependencies {
    implementation files("${rootDir}/libs/Mekanism-1.21.1-10.7.15.81.jar")
    compileOnly files("${rootDir}/libs/mekmm-1.21.1-1.4.1.jar")
    compileOnly("org.spongepowered:mixin:0.8.5")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching("META-INF/neoforge.mods.toml") {
        expand project.properties
    }
}

jar {
    manifest {
        attributes([
            'MixinConfigs': 'solarneutronactivatortweak.mixins.json'
        ])
    }
}
