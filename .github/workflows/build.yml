name: Build

on: [push, pull_request]

jobs:
  build-1-21-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build NeoForge 1.21.1
        run: ./gradlew :neoforge-1.21.1:build

      - name: Upload NeoForge 1.21.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: solarneutronactivatortweak-neoforge-1.21.1
          path: neoforge-1.21.1/build/libs/*.jar

  build-1-20-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Forge 1.20.1
        run: |
          cd forge-1.20.1
          chmod +x gradlew
          ./gradlew build

      - name: Build NeoForge 1.20.1
        run: |
          cd neoforge-1.20.1
          chmod +x gradlew
          ./gradlew build

      - name: Upload Forge 1.20.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: solarneutronactivatortweak-forge-1.20.1
          path: forge-1.20.1/build/libs/*.jar

      - name: Upload NeoForge 1.20.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: solarneutronactivatortweak-neoforge-1.20.1
          path: neoforge-1.20.1/build/libs/*.jar